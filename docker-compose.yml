# TourCRM development environment (Issue #8).
#
# DEVELOPMENT ONLY — not production-ready. No reverse proxy, no TLS, no
# production secrets/backup. See docs/08-infrastructure/infrastructure-and-devops.md
# for the production baseline, which is a separate, later concern.
#
# Usage: cp .env.example .env, then `docker compose up --build`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Intentionally no `ports:` mapping — PostgreSQL is reachable only on the
    # internal Compose network (backend connects via the `db` service name),
    # per Issue #8's requirement not to expose it on the host by default.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - tourcrm-dev

  backend:
    build:
      context: ./apps/api
    environment:
      # Constructed here (not duplicated in .env) using the Compose service
      # name `db` as host — never `localhost`.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      # `service_healthy` — not just service_started — so a not-yet-ready
      # PostgreSQL never looks like a satisfied dependency.
      db:
        condition: service_healthy
    networks:
      - tourcrm-dev

  frontend:
    build:
      context: ./apps/web
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      # Anonymous volume: keeps the image's own node_modules (installed at
      # build time) instead of an absent/incompatible host node_modules.
      - /app/node_modules
    networks:
      - tourcrm-dev

networks:
  tourcrm-dev:

volumes:
  # Named volume: survives `docker compose down` and container recreation.
  # Removed only by explicit `docker compose down -v` (documented clean
  # reset) — never as a side effect of normal start/stop.
  postgres_data:

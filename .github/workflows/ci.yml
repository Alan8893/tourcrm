name: CI

# Minimal mandatory CI (Issue #9). No production deployment, no release
# automation — see docs/03-architecture/technology-stack.md "CI/CD" for the
# canonical minimum-checks list this implements.
on:
  pull_request:
  push:
    branches: [main]

# No job needs to write to the repository or call the GitHub API.
permissions:
  contents: read

env:
  # Matches the versions pinned in apps/api/Dockerfile, apps/web/Dockerfile
  # and docker-compose.yml (Issue #8) — see the PR description for the
  # cross-check.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (lint, typecheck, unit + API tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      # No PostgreSQL here on purpose: unit/API tests never touch a
      # database (tests/integration is the DB-backed suite — see the
      # `integration` job). This keeps the fast checks fast and means a
      # missing/unavailable database can never make this job's result
      # ambiguous.
      - name: Unit + API tests
        run: pytest tests/unit tests/api tests/test_smoke.py -v

  integration:
    name: Backend integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        # Same major version as docker-compose.yml (Issue #8) and the
        # PostgreSQL foundation (Issue #5).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tourcrm_test
        ports:
          - 5432:5432
        # The Actions runner blocks job steps until this reports healthy —
        # depends_on/service availability is never assumed from the
        # container merely having started.
        options: >-
          --health-cmd "pg_isready -U test -d tourcrm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Ephemeral, CI-only credentials for a disposable service container —
      # never production data, never a secret. tests/integration itself
      # applies Alembic migrations (idempotently, on a freshly reset
      # schema) as part of each test, so no separate migration step is
      # needed here.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/tourcrm_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Integration tests (PostgreSQL + Alembic)
        run: pytest tests/integration -v

  scheduler:
    # Issue #289, ADR-0044: builds the API image (which pins supercronic and
    # verifies its SHA-256 at build time), validates the repository crontab
    # with `supercronic -test` (no database), then runs the scheduler
    # container through real every-minute iterations.
    name: Scheduler (image build, crontab validation, runtime smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tourcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tourcrm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IMAGE: tourcrm-api:ci
      # Ephemeral, CI-only credentials for a disposable service container,
      # reached from containers on the host network.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/tourcrm_test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (pinned, checksum-verified supercronic)
        run: docker build -t "$IMAGE" apps/api

      - name: supercronic version matches the pinned release
        run: |
          pinned="$(sed -n 's/^ARG SUPERCRONIC_VERSION=//p' apps/api/Dockerfile)"
          installed="$(docker run --rm "$IMAGE" supercronic -version)"
          echo "pinned=$pinned installed=$installed"
          test -n "$pinned" && test "$installed" = "$pinned"

      - name: Validate crontab (supercronic -test, no database)
        run: docker run --rm --network none "$IMAGE" supercronic -test /app/scheduler/crontab

      - name: Image runs as non-root
        run: test "$(docker run --rm "$IMAGE" id -u)" != "0"

      - name: Apply migrations to the CI database
        run: docker run --rm --network host -e DATABASE_URL "$IMAGE" alembic upgrade head

      - name: Scheduler runtime smoke test
        run: .github/scripts/scheduler-smoke-test.sh "$IMAGE" "$DATABASE_URL"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  repository:
    name: Repository structure and Docker Compose config checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      # Docker + the Compose plugin are pre-installed on ubuntu-latest
      # runners; tests/test_docker_compose.py only calls `docker compose
      # config` (static validation), it never builds or starts containers.
      - name: Repository-level tests
        run: pytest tests/ -v

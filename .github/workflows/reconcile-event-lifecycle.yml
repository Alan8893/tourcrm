name: Reconcile Event lifecycle docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize canonical Event lifecycle
        shell: python
        run: |
          from pathlib import Path
          replacements = [
            (Path("docs/02-requirements/business-rules.md"), """### 10.1 Жизненный цикл Event\n\nРекомендуемые статусы:\n\n- draft;\n- planned;\n- published;\n- cancelled;\n- completed;\n- archived.\n\nПереходы между статусами должны быть ограничены правилами жизненного цикла.\n""", """### 10.1 Жизненный цикл Event\n\nКанонические статусы Event определены ADR-0018:\n\n- `draft`;\n- `published`;\n- `in_progress`;\n- `completed`;\n- `cancelled`;\n- `archived`.\n\nДопустимые переходы:\n\n```text\ndraft -> published\npublished -> in_progress\npublished -> cancelled\nin_progress -> completed\nin_progress -> cancelled\ncompleted -> archived\ncancelled -> archived\n```\n\nДругие переходы не допускаются базовым контрактом API. Статус `planned` не является отдельным состоянием: запланированное, но ещё не опубликованное мероприятие остаётся в `draft`.\n\nКанонические значения статусов в домене и API записываются в lowercase.\n"""),
            (Path("docs/04-modules/events-and-schedule.md"), """## 4. Жизненный цикл Event\n\nПредлагаемые статусы:\n\n```text\nDRAFT\nPUBLISHED\nIN_PROGRESS\nCOMPLETED\nCANCELLED\nARCHIVED\n```\n\n### Правила переходов\n\n```text\nDRAFT → PUBLISHED\nPUBLISHED → IN_PROGRESS\nPUBLISHED → CANCELLED\nIN_PROGRESS → COMPLETED\nIN_PROGRESS → CANCELLED\nCOMPLETED → ARCHIVED\nCANCELLED → ARCHIVED\n```\n\nНедопустимые переходы должны отклоняться API.\n\nПовторная публикация отменённого или завершённого мероприятия выполняется только через явно определённую бизнес-операцию, если такая необходимость появится позже.\n""", """## 4. Жизненный цикл Event\n\nКанонические статусы определены ADR-0018 и являются единым контрактом домена и API:\n\n```text\ndraft\npublished\nin_progress\ncompleted\ncancelled\narchived\n```\n\n### Правила переходов\n\n```text\ndraft → published\npublished → in_progress\npublished → cancelled\nin_progress → completed\nin_progress → cancelled\ncompleted → archived\ncancelled → archived\n```\n\nНедопустимые переходы должны отклоняться API. Статус `planned` не является отдельным состоянием: запланированное, но ещё не опубликованное мероприятие остаётся в `draft`.\n\nПовторная публикация отменённого или завершённого мероприятия выполняется только через явно определённую бизнес-операцию, если такая необходимость появится позже.\n"""),
            (Path("docs/05-api/events-api.md"), """## 8. Event status\n\n### POST `/api/v1/events/{event_id}/status`\n\nСтатусы определены в business rules.\n\nНедопустимые переходы отклоняются.\n\nCancellation reason обязателен при отмене.\n""", """## 8. Event status\n\n### POST `/api/v1/events/{event_id}/status`\n\nКанонические статусы и переходы определены ADR-0018 и совпадают с `business-rules.md` и `events-and-schedule.md`:\n\n- `draft`\n- `published`\n- `in_progress`\n- `completed`\n- `cancelled`\n- `archived`\n\nДопустимые переходы:\n\n```text\ndraft -> published\npublished -> in_progress\npublished -> cancelled\nin_progress -> completed\nin_progress -> cancelled\ncompleted -> archived\ncancelled -> archived\n```\n\nНедопустимые переходы отклоняются. `planned` не является отдельным статусом Event.\n\nCancellation reason обязателен при отмене.\n""")
          ]
          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/reconcile-event-lifecycle.yml").unlink()
      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/02-requirements/business-rules.md docs/04-modules/events-and-schedule.md docs/05-api/events-api.md .github/workflows/reconcile-event-lifecycle.yml
          git commit -m "docs: synchronize canonical Event lifecycle"
          git push
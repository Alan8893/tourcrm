[tool.pytest.ini_options]
# Test configuration foundation (Issue #7). Deps stay in requirements*.txt;
# this file only configures tooling already in the approved stack (pytest,
# pytest-cov) — it does not introduce a new package manager.
#
# Selective runs use directory/path targeting (pytest tests/unit,
# tests/integration, tests/api, or a single file) rather than custom
# markers, so no marker plumbing had to be retrofitted onto the existing
# Issue #5/#6 test files.
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/foundation.py"]

[tool.coverage.report]
# No enforced minimum: docs/03-architecture/technology-stack.md and the other
# Issue #7 reference documents do not define a coverage threshold. This
# section only shapes the optional report; `pytest --cov` never fails the
# build on a percentage. See apps/api/README.md "Coverage" section.
skip_empty = true

[tool.ruff]
target-version = "py312"
# Matches the line length already in use across Issues #4-#7 (many lines
# sit in the high-80s/90s) rather than reformatting existing code to fit
# ruff's 88-char default.
line-length = 100
# Autogenerated Alembic migration scripts are not hand-maintained style; the
# `alembic revision --autogenerate` template is not ours to reformat.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Explicit, minimal selection (technology-stack.md's "backend lint" CI
# minimum) rather than relying on ruff's own shifting version-to-version
# default: pyflakes (F) + pycodestyle (E, W) + import sorting (I). No
# opinionated/modernization rule sets (UP, BLE, PL, ...) added on top.
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
